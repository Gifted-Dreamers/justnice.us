    </div>

  <!-- PDF cards grid (populated by script) -->
  <section class="py-12 md:py-16">
    <div class="max-w-7xl mx-auto px-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="download-cards">

      </div>

<!-- build:footer -->
<!-- Build download cards with DOM (no innerHTML for user content) -->
  <script>
    (function () {
      var downloads = [
        { file: "SurvivalIllustrated.pdf", title: "Survival Illustrated", description: "Illustrated 109-page survival guide covering essential skills for emergency preparedness, self-sufficiency, and community resilience." },
        { file: "ANONYMOUS--A-GUIDE-TO-POLITICAL-ORGANIZING-v1.4.pdf", title: "A Guide to Political Organizing (v1.4)", description: "Anonymous guide to effective political organizing and movement building." },
        { file: "ANONYMOUS_PROTEST_MANUAL_BOOTS ON THE GROUND.pdf", title: "Protest Manual: Boots on the Ground", description: "On-the-ground safety and tactics for protests and direct action." },
        { file: "Emergency-Battery-Network-Toolkit.pdf", title: "Emergency Battery Network Toolkit", description: "How to build and run community battery and power-sharing networks in emergencies." },
        { file: "Everyday Antifascist Survival Resistance Checklist.pdf", title: "Everyday Antifascist Survival & Resistance Checklist", description: "Daily practices and checklists for community safety and antifascist organizing." },
        { file: "How to Push and Shove Your Local Democratic Party into Action.pdf", title: "How to Push Your Local Democratic Party into Action", description: "Tactics for engaging and shifting local party structures toward action." },
        { file: "Legal Tips for High Risk.pdf", title: "Legal Tips for High Risk", description: "Legal preparedness and rights for people at higher risk of detention or surveillance." },
        { file: "Mutual-Aid-101-Toolkit-Solidarity-Survial-and-Resistance.pdf", title: "Mutual Aid 101: Solidarity, Survival and Resistance", description: "Foundations of mutual aid: building networks, logistics, and solidarity practices." },
        { file: "Resistance Readiness Wartime Edition.pdf", title: "Resistance Readiness Wartime Edition", description: "Preparedness and resistance planning for communities under threat." },
        { file: "Stop Gerrymandering in Your County A Toolkit for Fair Districts.pdf", title: "Stop Gerrymandering in Your County", description: "Toolkit for fair districting and fighting gerrymandering at the local level." },
        { file: "Swing State Playbook.pdf", title: "Swing State Playbook", description: "Strategic playbook for organizing and voter engagement in swing states." },
        { file: "The Doomsday Book.pdf", title: "The Doomsday Book", description: "Comprehensive preparedness and survival resource for extreme scenarios." },
        { file: "The Electric Cooperative Organizing Toolkit.pdf", title: "The Electric Cooperative Organizing Toolkit", description: "Organizing and democratic control of rural electric cooperatives." },
        { file: "The Liberty Memo.pdf", title: "The Liberty Memo", description: "Concise summary of civil liberties and rights in high-risk situations." },
        { file: "The Peoples Glossary of Regime Media Translations.pdf", title: "The People's Glossary of Regime Media Translations", description: "Decoding mainstream media language and propaganda framing." },
        { file: "TownHall Toolkit.pdf", title: "Town Hall Toolkit", description: "How to run and use town halls for accountability and community voice." },
        { file: "Underground Map to Medical Freedom.pdf", title: "Underground Map to Medical Freedom", description: "Resources and networks for medical autonomy and access outside institutional control." },
        { file: "What to Do If Masked Armed Men.pdf", title: "What to Do If Masked Armed Men", description: "Safety and response guidance when armed, masked actors threaten your community." },
        { file: "A Crash Course in Civic Hellraising.pdf", title: "A Crash Course in Civic Hellraising", description: "Practical guide to grassroots civic action and holding power accountable." }
      ];

      var container = document.getElementById('download-cards');
      if (!container) return;

      var baseUrl = 'https://dl.justnice.us/';
      downloads.forEach(function (item) {
        var url = baseUrl + encodeURIComponent(item.file);
        var card = document.createElement('div');
        card.className = 'bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow overflow-hidden flex flex-col';

        var previewWrap = document.createElement('div');
        previewWrap.className = 'pdf-preview rounded-t-xl overflow-hidden flex items-center justify-center';
        var obj = document.createElement('object');
        obj.data = url + '#page=1';
        obj.type = 'application/pdf';
        obj.className = 'w-full h-full';
        obj.title = 'Preview: ' + item.title;
        var fallback = document.createElement('div');
        fallback.className = 'w-full h-full flex items-center justify-center bg-gray-200 text-gray-500';
        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'w-16 h-16');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('viewBox', '0 0 24 24');
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('d', 'M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z');
        svg.appendChild(path);
        fallback.appendChild(svg);
        obj.appendChild(fallback);
        previewWrap.appendChild(obj);

        var body = document.createElement('div');
        body.className = 'p-4 flex flex-col flex-grow';
        var h2 = document.createElement('h2');
        h2.className = 'text-lg font-bold text-gray-900 mb-2 line-clamp-2';
        h2.textContent = item.title;
        var p = document.createElement('p');
        p.className = 'text-gray-600 text-sm leading-relaxed flex-grow mb-4';
        p.textContent = item.description;
        var a = document.createElement('a');
        a.href = url;
        a.download = '';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'inline-flex items-center justify-center gap-2 bg-maroon text-white px-4 py-2.5 rounded-lg font-semibold hover:bg-[#6B1520] transition-colors text-sm';
        var dlSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        dlSvg.setAttribute('class', 'w-4 h-4');
        dlSvg.setAttribute('fill', 'none');
        dlSvg.setAttribute('stroke', 'currentColor');
        dlSvg.setAttribute('viewBox', '0 0 24 24');
        var dlPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        dlPath.setAttribute('stroke-linecap', 'round');
        dlPath.setAttribute('stroke-linejoin', 'round');
        dlPath.setAttribute('stroke-width', '2');
        dlPath.setAttribute('d', 'M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4');
        dlSvg.appendChild(dlPath);
        a.appendChild(dlSvg);
        a.appendChild(document.createTextNode(' Download PDF'));
        body.appendChild(h2);
        body.appendChild(p);
        body.appendChild(a);
        card.appendChild(previewWrap);
        card.appendChild(body);
        container.appendChild(card);
      });
    })();
  </script>
