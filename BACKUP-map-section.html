<!-- RESOURCE MAP SECTION                         -->
<!-- ============================================ -->
<section id="resource-map" class="py-16 md:py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4">
    <h2 class="text-3xl md:text-4xl font-bold text-center text-gray-900 mb-4" data-i18n="map.title">
      Find Resources Near You
    </h2>
    <p class="text-center text-gray-600 max-w-3xl mx-auto mb-3" data-i18n="map.subtitle">
      Legal aid offices, rapid response hotlines, mutual aid networks, bond funds, and training sessions across the United States.
    </p>
    <p class="text-center text-sm text-gray-600 mb-2" data-i18n="map.help.click">
      Click a pin for details. Use the filters below to narrow by resource type.
    </p>
    <p class="text-center text-sm text-gray-500 mb-8">
      <a href="#contact-form" class="text-[#F5A623] hover:text-[#D4911E] underline underline-offset-2 transition-colors" data-i18n="map.help.submit">Submit a new resource</a>
      &nbsp;&middot;&nbsp; <span data-i18n="map.help.updated">Last updated:</span> February 11, 2026
    </p>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap justify-center gap-2 mb-6" role="group" aria-label="Filter resource types">
      <button onclick="filterMarkers('all')" id="filter-all"
              class="filter-btn px-4 py-2 rounded-full text-sm font-semibold text-white bg-maroon transition-all" data-i18n="map.filter.all">
        All
      </button>
      <button onclick="filterMarkers('legal')" id="filter-legal"
              class="filter-btn px-4 py-2 rounded-full text-sm font-semibold text-white bg-blue-600 opacity-60 hover:opacity-100 transition-all" data-i18n="map.filter.legal">
        Legal
      </button>
      <button onclick="filterMarkers('hotline')" id="filter-hotline"
              class="filter-btn px-4 py-2 rounded-full text-sm font-semibold text-white bg-red-600 opacity-60 hover:opacity-100 transition-all" data-i18n="map.filter.hotline">
        Hotlines
      </button>
      <button onclick="filterMarkers('mutual_aid')" id="filter-mutual_aid"
              class="filter-btn px-4 py-2 rounded-full text-sm font-semibold text-white bg-green-600 opacity-60 hover:opacity-100 transition-all" data-i18n="map.filter.mutual_aid">
        Mutual Aid
      </button>
      <button onclick="filterMarkers('bond_fund')" id="filter-bond_fund"
              class="filter-btn px-4 py-2 rounded-full text-sm font-semibold text-white bg-purple-600 opacity-60 hover:opacity-100 transition-all" data-i18n="map.filter.bond_fund">
        Bond Funds
      </button>
      <button onclick="filterMarkers('training')" id="filter-training"
              class="filter-btn px-4 py-2 rounded-full text-sm font-semibold text-white bg-orange-500 opacity-60 hover:opacity-100 transition-all" data-i18n="map.filter.training">
        Training
      </button>
    </div>

    <!-- Map Container -->
    <div id="map" style="height: 500px; width: 100%;" class="rounded-lg shadow-lg bg-gray-200"></div>

  </div>
</section>
